[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-toolbox"
version = "0.1.0"
description = "Extensible benchmark toolbox for holistic indoor scene understanding models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Benchmark Toolbox contributors" }
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
benchmark-toolbox = "benchmark_toolbox.cli:main"

[project.urls]
Repository = "https://github.com/HoloPano-dissertation/benchmark-toolbox"
Documentation = "https://github.com/HoloPano-dissertation/benchmark-toolbox/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
