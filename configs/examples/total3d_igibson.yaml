extends: ../protocols/igibson_boxes.yaml

experiment_name: total3d_igibson_env
output_dir: ../../artifacts/total3d_igibson_env

model:
  type: dpc
  parameters:
    environment: ../environments/dpc.yaml
    runner_args: ["--pred-root", "out/pano3d_total3d", "--model", "total3d-pano", "--config", "configs/pano3d_igibson_total3d.yaml", "--relation-adjust", "False"]
    timeout_seconds: 7200

dataset:
  type: manifest
  parameters:
    manifest: /PATH/TO/Pano3D/data/igibson_bench/manifest.jsonl
