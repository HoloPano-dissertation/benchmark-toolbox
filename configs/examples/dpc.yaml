experiment_name: dpc
seed: 42
output_dir: ../../artifacts/dpc

model:
  type: dpc
  parameters:
    environment: ../environments/dpc.yaml

dataset:
  type: igibson
  parameters:
    manifest: ../../data/examples/manifest.jsonl

metrics:
  - type: layout_iou_3d
  - type: object_map
    parameters:
      iou_threshold: 0.5
  - type: collision_rate
