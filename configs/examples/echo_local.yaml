experiment_name: echo_local
seed: 42
output_dir: ../../artifacts/echo

model:
  type: subprocess
  parameters:
    environment: ../environments/echo.yaml

dataset:
  type: manifest
  parameters:
    manifest: ../../data/examples/manifest.jsonl

metrics:
  - type: layout_iou_3d
  - type: object_map
    parameters:
      iou_threshold: 0.5
  - type: collision_rate
