experiment_name: holopano_mock
seed: 42
output_dir: ../../artifacts/holopano_mock

model:
  type: fixture
  parameters:
    prediction_dir: ../../data/examples/holopano_mock_predictions

dataset:
  type: igibson
  parameters:
    manifest: ../../data/examples/manifest.jsonl

metrics:
  - type: layout_iou_3d
  - type: object_map
    parameters:
      iou_threshold: 0.5
  - type: object_map_dataset
    parameters:
      iou_threshold: 0.5
  - type: collision_rate
