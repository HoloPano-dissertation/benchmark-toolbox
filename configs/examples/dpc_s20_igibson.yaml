extends: ../protocols/igibson_boxes.yaml

experiment_name: dpc_s20_igibson_env
output_dir: ../../artifacts/dpc_s20_igibson_env

model:
  type: dpc
  parameters:
    environment: ../environments/dpc.yaml
    runner_args: ["--pred-root", "out/pano3d_dpc_s20", "--model", "dpc-s20"]
    timeout_seconds: 7200

dataset:
  type: manifest
  parameters:
    manifest: /PATH/TO/Pano3D/data/igibson_bench/manifest.jsonl
